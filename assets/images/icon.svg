<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>
  <g transform="translate(256,256)">
    <!-- Graduation Cap -->
    <g transform="translate(0,-20)">
      <!-- Cap Top -->
      <polygon points="-120,0 0,-60 120,0 0,40" fill="#000000"/>
      <!-- Cap Base -->
      <ellipse cx="0" cy="0" rx="120" ry="30" fill="#000000" opacity="0.8"/>
      <!-- Tassel -->
      <line x1="120" y1="0" x2="130" y2="60" stroke="#000000" stroke-width="4"/>
      <circle cx="130" cy="65" r="8" fill="#000000"/>
    </g>
    <!-- Book -->
    <g transform="translate(0,80)">
      <rect x="-50" y="-30" width="100" height="60" fill="#000000" rx="3"/>
      <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#ffffff" stroke-width="3"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
  <!-- Text -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#000000">SMS</text>
</svg>
